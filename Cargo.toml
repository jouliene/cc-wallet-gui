[workspace]
members = [
    "crates/cc-wallet-tycho",
    "crates/cc-wallet-vault",
    "crates/cc-wallet-domain",
    "crates/cc-wallet-storage",
    "crates/cc-wallet-chain",
    "crates/cc-wallet-app",
    "crates/cc-wallet-ui-slint",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
argon2 = { version = "0.5.3", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["getrandom"] }
blake3 = "1.8"
zeroize = { version = "1.9", features = ["derive"] }
getrandom = "0.4"
tempfile = "3"
libc = "=0.2.186"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
overflow-checks = true
debug = false

[profile.dev.package."*"]
opt-level = 2
