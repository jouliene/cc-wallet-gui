[graph]
targets = [
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "quick-xml DoS reached only by wayland-scanner, a build-time proc-macro parsing the trusted bundled Wayland protocol XML; no attacker-controlled input. Pinned ^0.39, fix is >=0.41." },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml DoS via the same build-time wayland-scanner path; not runtime-reachable." },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; build-time proc-macro via Slint image/AVIF." },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; Slint SVG/font stack (resvg), latest Slint 1.17.1 still uses it." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; Slint SVG/font stack (resvg)." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "NCSA",
    "LicenseRef-Slint-Royalty-free-2.0",
]
confidence-threshold = 0.8
exceptions = [
]

[licenses.private]
ignore = true
registries = [
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = [
]
allow-workspace = false
deny = [
]

skip = [
]
skip-tree = [
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
